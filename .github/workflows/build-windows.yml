name: Package Windows Python Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item JusstBildTool.py package/JusstBildTool.py
          Copy-Item START_JusstBildTool.cmd package/START_JusstBildTool.cmd
          Copy-Item requirements.txt package/requirements.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: JusstBildTool-START
          path: package/
