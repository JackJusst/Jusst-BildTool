name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable Windows app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name JusstBildTool JusstBildTool.py

      - name: Add start file
        shell: pwsh
        run: |
          Set-Content -Path "dist/JusstBildTool/START_JusstBildTool.cmd" -Encoding ASCII -Value '@echo off`r`nstart "" "%~dp0JusstBildTool.exe"'

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JusstBildTool-Windows-Portable
          path: dist/JusstBildTool/
